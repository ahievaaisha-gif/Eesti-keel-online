<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 Academy | Eesti Keel Online</title>
<style>
:root {
  --green:#173f32;
  --green2:#245743;
  --green3:#326d51;
  --light:#f5f5ed;
  --cream:#fffef8;
  --gold:#c5a66a;
  --text:#26372e;
  --muted:#78847b;
  --border:#e6e9df;
  --red:#c64d4d;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--light);
  color:var(--text);
}

button { font:inherit; cursor:pointer; }

.topbar {
  height:76px;
  background:var(--cream);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 5%;
  gap:18px;
  position:sticky;
  top:0;
  z-index:20;
}

.profile-button {
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--gold);
  background:#f2eee1;
  color:var(--green);
  font-size:22px;
}

.brand {
  font-size:19px;
  font-weight:800;
  color:var(--green);
  letter-spacing:-.5px;
}

.brand span { color:var(--gold); }

.top-right {
  margin-left:auto;
  color:var(--muted);
  font-size:13px;
}

.overlay {
  position:fixed;
  inset:0;
  background:#10271e80;
  z-index:29;
  display:none;
}

.overlay.show { display:block; }

.sidebar {
  position:fixed;
  z-index:30;
  left:0;
  top:0;
  bottom:0;
  width:290px;
  background:var(--cream);
  padding:28px 22px;
  transform:translateX(-105%);
  transition:.3s;
  overflow-y:auto;
  box-shadow:10px 0 35px #00000012;
}

.sidebar.open { transform:translateX(0); }

.sidebar-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.sidebar-title {
  color:var(--green);
  font-weight:800;
  font-size:19px;
}

.close-menu {
  border:0;
  background:transparent;
  font-size:25px;
  color:var(--muted);
}

.nav-label {
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  margin:25px 10px 10px;
  text-transform:uppercase;
}

.nav-link {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border:0;
  border-radius:12px;
  background:transparent;
  text-align:left;
  color:var(--text);
  font-size:14px;
  margin:4px 0;
}

.nav-link:hover,
.nav-link.active {
  background:#eaf0e9;
  color:var(--green);
  font-weight:700;
}

.nav-icon { width:22px; font-size:17px; }

.level-link {
  display:flex;
  justify-content:space-between;
  padding:12px 14px;
  color:var(--muted);
  font-size:14px;
  text-decoration:none;
  border-radius:10px;
}

.level-link.current {
  background:#eaf0e9;
  color:var(--green);
  font-weight:800;
}

.level-link:hover { background:#f0f1e9; }

main {
  max-width:1160px;
  margin:auto;
  padding:36px 28px 80px;
}

.page { display:none; }
.page.active { display:block; }

.breadcrumb {
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.hero {
  background:var(--green);
  color:white;
  padding:43px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  margin-bottom:25px;
}

.hero:after {
  content:"Ã";
  position:absolute;
  right:55px;
  top:-65px;
  font-size:260px;
  font-weight:900;
  color:#ffffff0c;
}

.hero small {
  color:#d5c18e;
  letter-spacing:2px;
  font-size:11px;
  font-weight:800;
}

.hero h1 {
  font-size:36px;
  margin:13px 0;
  position:relative;
  z-index:1;
}

.hero p {
  color:#d6e0d8;
  max-width:590px;
  line-height:1.7;
  font-size:15px;
  position:relative;
  z-index:1;
}

.hero-tag {
  display:inline-block;
  margin-top:12px;
  background:#ffffff18;
  border:1px solid #ffffff30;
  padding:8px 13px;
  border-radius:30px;
  font-size:12px;
}

.section-heading {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin:35px 0 17px;
}

.section-heading h2 {
  margin:0;
  color:var(--green);
  font-size:23px;
}

.section-heading p {
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.progress-card {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
  margin-bottom:25px;
}

.progress-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
  gap:12px;
}

.progress-top strong { color:var(--green); }

.progress-track {
  height:9px;
  background:#e9ece4;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  width:0%;
  background:var(--green3);
  border-radius:20px;
  transition:.4s;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}
.stats-extra{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0 0 25px}

.stat {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:15px;
  padding:19px;
}

.stat-number {
  font-size:25px;
  color:var(--green);
  font-weight:800;
}

.stat-label {
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:17px;
  padding:23px;
  transition:.2s;
}

.card:hover {
  transform:translateY(-3px);
  border-color:#c9d5c8;
}

.card-icon {
  width:44px;
  height:44px;
  border-radius:13px;
  background:#eaf0e9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  margin-bottom:16px;
}

.card h3 {
  color:var(--green);
  margin:0 0 9px;
  font-size:17px;
}

.card p {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0 0 17px;
}

.primary-btn,
.secondary-btn {
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  font-size:13px;
}

.primary-btn {
  background:var(--green);
  color:white;
}

.primary-btn:hover { background:var(--green2); }

.secondary-btn {
  background:#eaf0e9;
  color:var(--green);
}

.full-btn { width:100%; }

.lesson-list {
  display:grid;
  gap:13px;
}

.lesson {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:15px;
  padding:19px;
  display:flex;
  align-items:center;
  gap:16px;
}

.lesson-number {
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eaf0e9;
  color:var(--green);
  font-weight:800;
  flex-shrink:0;
}

.lesson-info { flex:1; }

.lesson-info h3 {
  margin:0 0 5px;
  font-size:15px;
  color:var(--green);
}

.lesson-info p {
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.lesson-status {
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.lesson.opened { border-color:#b8cdb9; }

.lesson-content {
  display:none;
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:17px;
  padding:25px;
  margin-top:15px;
  line-height:1.8;
}

.lesson-content.show { display:block; }

.lesson-content h2,.lesson-content h3 { color:var(--green); line-height:1.35; }
.lesson-content h2 { margin:0 0 8px; font-size:23px; }
.lesson-content h3 { margin:24px 0 10px; padding-top:12px; border-top:1px solid var(--border); font-size:17px; }
.lesson-content p,.lesson-content li { max-width:780px; line-height:1.85; font-size:15px; }
.lesson-content .example { display:block; line-height:1.8; padding:15px 17px; margin:13px 0; border-left:3px solid var(--gold); }
.lesson-content .example b { color:var(--green); }
.lesson-content .lesson-lead { color:var(--muted); margin:0 0 18px; }
.lesson-content .lesson-tip { background:#f7f3e8; border:1px solid #eadfc8; border-radius:12px; padding:14px 16px; margin:16px 0; line-height:1.7; }

.example {
  background:#eef2e9;
  padding:13px 16px;
  border-radius:10px;
  margin:10px 0;
}

.example strong { color:var(--green); }

.word-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.word {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:15px;
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:12px;
}

.word strong { color:var(--green); display:block; margin-bottom:5px; }
.word span { color:var(--muted); font-size:13px; line-height:1.5; }
.word-learned { border-color:#b8cdb9; background:#f1f6ef; }
.word .secondary-btn { flex-shrink:0; align-self:center; white-space:nowrap; }
.category-tabs .tab-btn { min-height:38px; }
@media(max-width:520px){.word{align-items:flex-start;flex-direction:column}.word .secondary-btn{width:100%}}

.category-tabs {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:18px;
}

.tab-btn {
  border:1px solid var(--border);
  border-radius:30px;
  padding:9px 15px;
  background:var(--cream);
  color:var(--text);
  font-size:12px;
}

.tab-btn.active {
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.question-box {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px;
  margin-top:15px;
}

.question-box h3 {
  color:var(--green);
  margin-top:0;
}

.answer-option {
  display:block;
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  padding:14px;
  margin:9px 0;
  color:var(--text);
  transition:.15s;
}

.answer-option:hover { border-color:var(--green3); }

.answer-option.correct {
  border:2px solid #398454;
  background:#eaf5ed;
}

.answer-option.wrong {
  border:2px solid var(--red);
  background:#fff0ef;
}

.feedback {
  min-height:24px;
  margin:12px 0;
  font-size:13px;
  font-weight:700;
}

.test-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.test-pill {
  background:#eaf0e9;
  color:var(--green);
  padding:7px 11px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.test-dots {
  display:flex;
  gap:6px;
  margin:15px 0;
}

.test-dot {
  height:6px;
  flex:1;
  border-radius:10px;
  background:#e4e8df;
}

.test-dot.done { background:var(--green3); }

.result {
  text-align:center;
  padding:25px 10px;
}

.result h2 { color:var(--green); }

.result-score {
  font-size:45px;
  color:var(--green);
  font-weight:900;
  margin:15px 0;
}

.locked {
  opacity:.55;
  background:#f1f1eb;
}

.notice {
  background:#f2eee1;
  border:1px solid #e7ddc4;
  border-radius:12px;
  padding:15px;
  color:#665535;
  font-size:13px;
  line-height:1.6;
  margin:18px 0;
}

@media(max-width:700px) {
  main { padding:25px 16px 60px; }
  .topbar { padding:0 17px; }
  .top-right { display:none; }
  .hero { padding:28px 23px; }
  .hero h1 { font-size:28px; }
  .hero:after { right:0; font-size:180px; }
  .grid,.word-grid { grid-template-columns:1fr; }
  .stats { gap:8px; }
  .stat { padding:13px; }
  .stat-number { font-size:21px; }
  .lesson { align-items:flex-start; }
  .lesson-status { display:none; }
}

.back-home {
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  background:var(--cream);
  color:var(--green);
  padding:10px 15px;
  border-radius:10px;
  font-weight:700;
  font-size:13px;
  margin:0 0 18px;
}
.back-home:hover { background:#eaf0e9; }
.section-progress {
  background:var(--cream);
  border:1px solid var(--border);
  padding:17px 20px;
  border-radius:14px;
  margin:0 0 22px;
}
.section-progress-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  margin-bottom:10px;
}
.section-progress-top strong { color:var(--green); }
.section-progress-top span { color:var(--muted); }
.word-learned { border-color:#b8cdb9; background:#f3f7ef; }
@media(max-width:700px) {
  .section-progress { padding:14px; }
  .back-home { margin-bottom:14px; }
}

.lesson-actions,.word-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

.practice-topic-card{background:var(--cream);border:1px solid var(--border);border-radius:15px;padding:19px}
.practice-topic-card h3{color:var(--green);font-size:15px;margin:0 0 7px}
.practice-topic-card p{color:var(--muted);font-size:12px;margin:0 0 14px}
.vocab-quiz{background:var(--cream);border:1px solid var(--border);border-radius:17px;padding:22px;margin-top:22px}
.vocab-quiz h3{color:var(--green);margin-top:0}
.vocab-quiz-result{text-align:center;padding:18px}
.word-category-actions{margin:18px 0 24px;}

.practice-topic-card.is-complete{border-color:#b8cdb9;background:#f3f7ef;}
.practice-complete-label{display:inline-flex;align-items:center;gap:6px;color:#285642;font-size:12px;font-weight:800;margin-bottom:10px;}

.vocab-confirm h3{color:var(--green);margin:0 0 9px;font-size:20px;}

/* B2 content, styled to use the same visual language as A1/A2/B1 */
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--text);font-size:14px;margin:4px 0;font-weight:500}
.navbtn:hover,.navbtn.active{background:#eaf0e9;color:var(--green);font-weight:700}
.navbtn span:last-child{color:var(--muted);font-size:11px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;flex-wrap:wrap;margin:35px 0 17px}
.section-head h2{margin:0;color:var(--green);font-size:23px}
.section-head .sub,.sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.pill,.tag{display:inline-block;background:#eaf0e9;color:var(--green);border-radius:30px;padding:6px 11px;font-size:11px;font-weight:800}
.callout{background:#f2eee1;border:1px solid #e7ddc4;border-radius:12px;padding:15px;color:#665535;font-size:13px;line-height:1.7;margin:18px 0}
.toolbar,.lesson-actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
