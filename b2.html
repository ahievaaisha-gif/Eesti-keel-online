<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 Academy | Eesti Keel Online</title>
<style>
:root {
  --green:#173f32;
  --green2:#245743;
  --green3:#326d51;
  --light:#f5f5ed;
  --cream:#fffef8;
  --gold:#c5a66a;
  --text:#26372e;
  --muted:#78847b;
  --border:#e6e9df;
  --red:#c64d4d;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--light);
  color:var(--text);
}

button { font:inherit; cursor:pointer; }

.topbar {
  height:76px;
  background:var(--cream);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 5%;
  gap:18px;
  position:sticky;
  top:0;
  z-index:20;
}

.profile-button {
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--gold);
  background:#f2eee1;
  color:var(--green);
  font-size:22px;
}

.brand {
  font-size:19px;
  font-weight:800;
  color:var(--green);
  letter-spacing:-.5px;
}

.brand span { color:var(--gold); }

.top-right {
  margin-left:auto;
  color:var(--muted);
  font-size:13px;
}

.overlay {
  position:fixed;
  inset:0;
  background:#10271e80;
  z-index:29;
  display:none;
}

.overlay.show { display:block; }

.sidebar {
  position:fixed;
  z-index:30;
  left:0;
  top:0;
  bottom:0;
  width:290px;
  background:var(--cream);
  padding:28px 22px;
  transform:translateX(-105%);
  transition:.3s;
  overflow-y:auto;
  box-shadow:10px 0 35px #00000012;
}

.sidebar.open { transform:translateX(0); }

.sidebar-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.sidebar-title {
  color:var(--green);
  font-weight:800;
  font-size:19px;
}

.close-menu {
  border:0;
  background:transparent;
  font-size:25px;
  color:var(--muted);
}

.nav-label {
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  margin:25px 10px 10px;
  text-transform:uppercase;
}

.nav-link {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border:0;
  border-radius:12px;
  background:transparent;
  text-align:left;
  color:var(--text);
  font-size:14px;
  margin:4px 0;
}

.nav-link:hover,
.nav-link.active {
  background:#eaf0e9;
  color:var(--green);
  font-weight:700;
}

.nav-icon { width:22px; font-size:17px; }

.level-link {
  display:flex;
  justify-content:space-between;
  padding:12px 14px;
  color:var(--muted);
  font-size:14px;
  text-decoration:none;
  border-radius:10px;
}

.level-link.current {
  background:#eaf0e9;
  color:var(--green);
  font-weight:800;
}

.level-link:hover { background:#f0f1e9; }

main {
  max-width:1160px;
  margin:auto;
  padding:36px 28px 80px;
}

.page { display:none; }
.page.active { display:block; }

.breadcrumb {
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.hero {
  background:var(--green);
  color:white;
  padding:43px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  margin-bottom:25px;
}

.hero:after {
  content:"Õ";
  position:absolute;
  right:55px;
  top:-65px;
  font-size:260px;
  font-weight:900;
  color:#ffffff0c;
}

.hero small {
  color:#d5c18e;
  letter-spacing:2px;
  font-size:11px;
  font-weight:800;
}

.hero h1 {
  font-size:36px;
  margin:13px 0;
  position:relative;
  z-index:1;
}

.hero p {
  color:#d6e0d8;
  max-width:590px;
  line-height:1.7;
  font-size:15px;
  position:relative;
  z-index:1;
}

.hero-tag {
  display:inline-block;
  margin-top:12px;
  background:#ffffff18;
  border:1px solid #ffffff30;
  padding:8px 13px;
  border-radius:30px;
  font-size:12px;
}

.section-heading {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin:35px 0 17px;
}

.section-heading h2 {
  margin:0;
  color:var(--green);
  font-size:23px;
}

.section-heading p {
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.progress-card {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
  margin-bottom:25px;
}

.progress-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
  gap:12px;
}

.progress-top strong { color:var(--green); }

.progress-track {
  height:9px;
  background:#e9ece4;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  width:0%;
  background:var(--green3);
  border-radius:20px;
  transition:.4s;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}
.stats-extra{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0 0 25px}

.stat {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:15px;
  padding:19px;
}

.stat-number {
  font-size:25px;
  color:var(--green);
  font-weight:800;
}

.stat-label {
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:17px;
  padding:23px;
  transition:.2s;
}

.card:hover {
  transform:translateY(-3px);
  border-color:#c9d5c8;
}

.card-icon {
  width:44px;
  height:44px;
  border-radius:13px;
  background:#eaf0e9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  margin-bottom:16px;
}

.card h3 {
  color:var(--green);
  margin:0 0 9px;
  font-size:17px;
}

.card p {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0 0 17px;
}

.primary-btn,
.secondary-btn {
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
  font-size:13px;
}

.primary-btn {
  background:var(--green);
  color:white;
}

.primary-btn:hover { background:var(--green2); }

.secondary-btn {
  background:#eaf0e9;
  color:var(--green);
}

.full-btn { width:100%; }

.lesson-list {
  display:grid;
  gap:13px;
}

.lesson {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:15px;
  padding:19px;
  display:flex;
  align-items:center;
  gap:16px;
}

.lesson-number {
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eaf0e9;
  color:var(--green);
  font-weight:800;
  flex-shrink:0;
}

.lesson-info { flex:1; }

.lesson-info h3 {
  margin:0 0 5px;
  font-size:15px;
  color:var(--green);
}

.lesson-info p {
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.lesson-status {
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.lesson.opened { border-color:#b8cdb9; }

.lesson-content {
  display:none;
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:17px;
  padding:25px;
  margin-top:15px;
  line-height:1.8;
}

.lesson-content.show { display:block; }

.lesson-content h2,.lesson-content h3 { color:var(--green); line-height:1.35; }
.lesson-content h2 { margin:0 0 8px; font-size:23px; }
.lesson-content h3 { margin:24px 0 10px; padding-top:12px; border-top:1px solid var(--border); font-size:17px; }
.lesson-content p,.lesson-content li { max-width:780px; line-height:1.85; font-size:15px; }
.lesson-content .example { display:block; line-height:1.8; padding:15px 17px; margin:13px 0; border-left:3px solid var(--gold); }
.lesson-content .example b { color:var(--green); }
.lesson-content .lesson-lead { color:var(--muted); margin:0 0 18px; }
.lesson-content .lesson-tip { background:#f7f3e8; border:1px solid #eadfc8; border-radius:12px; padding:14px 16px; margin:16px 0; line-height:1.7; }

.example {
  background:#eef2e9;
  padding:13px 16px;
  border-radius:10px;
  margin:10px 0;
}

.example strong { color:var(--green); }

.word-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.word {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:15px;
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:12px;
}

.word strong { color:var(--green); display:block; margin-bottom:5px; }
.word span { color:var(--muted); font-size:13px; line-height:1.5; }
.word-learned { border-color:#b8cdb9; background:#f1f6ef; }
.word .secondary-btn { flex-shrink:0; align-self:center; white-space:nowrap; }
.category-tabs .tab-btn { min-height:38px; }
@media(max-width:520px){.word{align-items:flex-start;flex-direction:column}.word .secondary-btn{width:100%}}

.category-tabs {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:18px;
}

.tab-btn {
  border:1px solid var(--border);
  border-radius:30px;
  padding:9px 15px;
  background:var(--cream);
  color:var(--text);
  font-size:12px;
}

.tab-btn.active {
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.question-box {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px;
  margin-top:15px;
}

.question-box h3 {
  color:var(--green);
  margin-top:0;
}

.answer-option {
  display:block;
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  padding:14px;
  margin:9px 0;
  color:var(--text);
  transition:.15s;
}

.answer-option:hover { border-color:var(--green3); }

.answer-option.correct {
  border:2px solid #398454;
  background:#eaf5ed;
}

.answer-option.wrong {
  border:2px solid var(--red);
  background:#fff0ef;
}

.feedback {
  min-height:24px;
  margin:12px 0;
  font-size:13px;
  font-weight:700;
}

.test-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.test-pill {
  background:#eaf0e9;
  color:var(--green);
  padding:7px 11px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.test-dots {
  display:flex;
  gap:6px;
  margin:15px 0;
}

.test-dot {
  height:6px;
  flex:1;
  border-radius:10px;
  background:#e4e8df;
}

.test-dot.done { background:var(--green3); }

.result {
  text-align:center;
  padding:25px 10px;
}

.result h2 { color:var(--green); }

.result-score {
  font-size:45px;
  color:var(--green);
  font-weight:900;
  margin:15px 0;
}

.locked {
  opacity:.55;
  background:#f1f1eb;
}

.notice {
  background:#f2eee1;
  border:1px solid #e7ddc4;
  border-radius:12px;
  padding:15px;
  color:#665535;
  font-size:13px;
  line-height:1.6;
  margin:18px 0;
}

@media(max-width:700px) {
  main { padding:25px 16px 60px; }
  .topbar { padding:0 17px; }
  .top-right { display:none; }
  .hero { padding:28px 23px; }
  .hero h1 { font-size:28px; }
  .hero:after { right:0; font-size:180px; }
  .grid,.word-grid { grid-template-columns:1fr; }
  .stats { gap:8px; }
  .stat { padding:13px; }
  .stat-number { font-size:21px; }
  .lesson { align-items:flex-start; }
  .lesson-status { display:none; }
}


/* Навигация и прогресс разделов */
.back-home {
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  background:var(--cream);
  color:var(--green);
  padding:10px 15px;
  border-radius:10px;
  font-weight:700;
  font-size:13px;
  margin:0 0 18px;
}
.back-home:hover { background:#eaf0e9; }
.section-progress {
  background:var(--cream);
  border:1px solid var(--border);
  padding:17px 20px;
  border-radius:14px;
  margin:0 0 22px;
}
.section-progress-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  margin-bottom:10px;
}
.section-progress-top strong { color:var(--green); }
.section-progress-top span { color:var(--muted); }
.word-learned { border-color:#b8cdb9; background:#f3f7ef; }
@media(max-width:700px) {
  .section-progress { padding:14px; }
  .back-home { margin-bottom:14px; }
}


/* Последовательное обучение: переходы, словарный квиз и практика по темам */
.lesson-actions,.word-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.practice-topic-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.practice-topic-card{background:var(--cream);border:1px solid var(--border);border-radius:15px;padding:19px}
.practice-topic-card h3{color:var(--green);font-size:15px;margin:0 0 7px}
.practice-topic-card p{color:var(--muted);font-size:12px;margin:0 0 14px}
.vocab-quiz{background:var(--cream);border:1px solid var(--border);border-radius:17px;padding:22px;margin-top:22px}
.vocab-quiz h3{color:var(--green);margin-top:0}
.vocab-quiz-result{text-align:center;padding:18px}
.word-category-actions{margin:18px 0 24px;}
.word-category-actions .primary-btn{width:100%;min-height:48px;}
.practice-topic-card.is-complete{border-color:#b8cdb9;background:#f3f7ef;}
.practice-complete-label{display:inline-flex;align-items:center;gap:6px;color:#285642;font-size:12px;font-weight:800;margin-bottom:10px;}
.practice-topic-card .primary-btn:disabled{opacity:.7;cursor:default;}
.vocab-confirm-backdrop{position:fixed;inset:0;background:rgba(12,25,19,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;}
.vocab-confirm{width:min(100%,420px);background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:25px;box-shadow:0 18px 60px rgba(0,0,0,.25);text-align:center;}
.vocab-confirm-mark{width:48px;height:48px;border-radius:50%;margin:0 auto 14px;background:#f5ead0;color:#8a6727;display:grid;place-items:center;font-size:24px;font-weight:800;}
.vocab-confirm h3{color:var(--green);margin:0 0 9px;font-size:20px;}
.vocab-confirm p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 20px;}
.vocab-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.vocab-confirm-actions button{min-height:45px;}
@media(max-width:700px){.practice-topic-list{grid-template-columns:1fr}.lesson-actions>*{flex:1}.vocab-confirm{padding:22px 18px}.vocab-confirm-actions{grid-template-columns:1fr;}}




.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.resource-card{background:var(--cream);border:1px solid var(--border);border-radius:17px;padding:22px}.resource-card h3{color:var(--green);margin:8px 0}.resource-card p{color:var(--muted);font-size:14px;line-height:1.6}.resource-card .primary-btn{margin-top:12px}.reading-text,.writing-task,.opinion-card{background:var(--cream);border:1px solid var(--border);border-radius:16px;padding:24px;margin:16px 0;line-height:1.8}.reading-text h3,.writing-task h3,.opinion-card h3{color:var(--green)}
.reading-body{font-size:16px;line-height:2;letter-spacing:.1px;max-width:780px}
.reading-question{padding:16px 0;border-top:1px solid var(--border)}
.reading-question b{display:block;line-height:1.6;margin-bottom:8px}
.reading-question .answer-option{line-height:1.5}
.opinion-card{max-width:850px;padding:20px 22px}
.opinion-card .opinion-steps{display:grid;gap:9px;margin:14px 0}
.opinion-card .opinion-step{background:#f0f3eb;border-radius:10px;padding:11px 13px;line-height:1.6}
.opinion-card .opinion-phrases{columns:2;column-gap:28px}
@media(max-width:600px){.opinion-card .opinion-phrases{columns:1}}.reading-question{padding:14px 0;border-top:1px solid var(--border)}.reading-question button{display:block;width:100%;text-align:left;margin:7px 0}.writing-answer{width:100%;min-height:190px;border:1px solid var(--border);border-radius:12px;padding:14px;font:inherit;background:#fffefb;resize:vertical}.small-note{font-size:12px;color:var(--muted)}
.writing-guide{background:#eef2e9;border-radius:12px;padding:16px 18px;margin:15px 0;line-height:1.75}
.writing-guide h4{margin:0 0 8px;color:var(--green)}
.writing-guide ol{padding-left:22px}
.writing-checklist{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px;margin:14px 0}.grammar-tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf0e9;color:var(--green);font-size:11px;font-weight:700;margin:3px}.lesson-content h3{margin-top:24px}.lesson-content ul{line-height:1.8}.lesson-content .warning{background:#fff7e7;border-left:4px solid var(--gold);padding:13px 16px;border-radius:8px;margin:14px 0}.lesson-content .table-wrap{overflow-x:auto}.lesson-content table{border-collapse:collapse;width:100%;margin:14px 0;background:#fffefb}.lesson-content th,.lesson-content td{border:1px solid var(--border);padding:10px;text-align:left}.lesson-content th{background:#edf2eb;color:var(--green)}.section-intro{max-width:760px;color:var(--muted);line-height:1.7}.resource-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.resource-tabs button{border:1px solid var(--border);background:var(--cream);padding:9px 13px;border-radius:20px;color:var(--text)}.resource-tabs button.active{background:var(--green);color:white}.result-box{padding:16px;background:#edf2eb;border-radius:12px;margin-top:12px;line-height:1.7}
.practice-topic-card .result-box{margin:12px 0;text-align:left;font-size:13px}
.practice-topic-card .primary-btn{width:100%;margin-top:8px}
.mistake-details{background:#fff8f6;border:1px solid #efd8d4;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:13px;line-height:1.65}
.mistake-details summary{cursor:pointer;color:var(--red);font-weight:700}
.mistake-details li{margin:9px 0}
#readingFinish:disabled{opacity:.55;cursor:not-allowed}
.reading-result-mistakes li{margin:10px 0;line-height:1.6}
@media(max-width:700px){.home-grid{grid-template-columns:1fr}.reading-text,.writing-task,.opinion-card{padding:17px}}


/* B2 content, styled to use the same visual language as A1/A2/B1 */
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--text);font-size:14px;margin:4px 0;font-weight:500}
.navbtn:hover,.navbtn.active{background:#eaf0e9;color:var(--green);font-weight:700}
.navbtn span:last-child{color:var(--muted);font-size:11px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;flex-wrap:wrap;margin:35px 0 17px}
.section-head h2{margin:0;color:var(--green);font-size:23px}
.section-head .sub,.sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.pill,.tag{display:inline-block;background:#eaf0e9;color:var(--green);border-radius:30px;padding:6px 11px;font-size:11px;font-weight:800}
.callout{background:#f2eee1;border:1px solid #e7ddc4;border-radius:12px;padding:15px;color:#665535;font-size:13px;line-height:1.7;margin:18px 0}
.toolbar,.lesson-actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:13px;background:var(--green);color:white}
.btn:hover{background:var(--green2)}
.btn.secondary{background:#eaf0e9;color:var(--green)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.topic-card{display:flex;flex-direction:column;min-height:145px}
.topic-card .lesson-actions{margin-top:auto}
.wordlist{width:100%;border-collapse:collapse;background:var(--cream);font-size:14px}
.wordlist th{text-align:left;background:#eaf0e9;color:var(--green);padding:12px}
.wordlist td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
.wordlist tr:last-child td{border-bottom:0}
.word{font-weight:800;color:var(--green)}
.example{background:#eef2e9;padding:12px 15px;border-radius:10px;margin:8px 0;color:var(--text);font-style:normal}
.lesson{display:block;background:var(--cream);border:1px solid var(--border);border-radius:15px;padding:19px;margin:13px 0;line-height:1.8}
.lesson h3{margin:0 0 8px;color:var(--green);font-size:17px}
.lesson p{font-size:14px;line-height:1.8}
.question{padding:16px 0;border-bottom:1px solid var(--border)}
.option{display:block;padding:11px 13px;border:1px solid var(--border);border-radius:10px;margin:7px 0;background:white;cursor:pointer}
.option.correct{border:2px solid #398454;background:#eaf5ed}
.option.wrong{border:2px solid var(--red);background:#fff0ef}
.feedback{font-size:13px;margin-top:7px;line-height:1.6}
.result{padding:16px;background:#edf2eb;border-radius:12px;margin:14px 0;line-height:1.7}
.field{width:100%;border:1px solid var(--border);border-radius:11px;padding:12px;background:white}
.textarea{min-height:180px;resize:vertical}
.progressbar{height:9px;background:#e8e7df;border-radius:20px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--green3)}
.small{font-size:12px}.muted{color:var(--muted)}.gold{color:#9b792e}
.back{border:1px solid var(--border);background:var(--cream);color:var(--green);padding:10px 15px;border-radius:10px;font-weight:700;margin:0 0 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none!important}
#main>.hero{margin-bottom:25px}
@media(max-width:700px){.section-head{align-items:flex-start}.wordlist{font-size:12px}.wordlist th,.wordlist td{padding:8px}.two{grid-template-columns:1fr}.navbtn{font-size:13px}}

function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setSection(s){state.section=s;document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.section===s));render();}
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{setSection(b.dataset.section);document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show");}));

function sectionHead(title,sub){return `<div class="section-head"><div><h2>${title}</h2><p class="sub">${sub}</p></div><span class="pill">B2 · Eesti keel</span></div>`}
function mark(key){state.done[key]=!state.done[key];save();render();}
function save(){try{localStorage.setItem("eko_b2_progress",JSON.stringify({done:state.done,quizResult:state.quizResult}));}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem("eko_b2_progress")||sessionStorage.getItem("eko_b2_progress")||"{}");state.done=d.done||{};state.quizResult=d.quizResult||{};}catch(e){}}
function vocabView(){let i=state.openLesson===null?0:state.openLesson;let cat=vocab[i];if(state.openLesson!==null){let words=cat[2];return `<button class="back" onclick="state.openLesson=null;render()">← Назад к категориям</button>${sectionHead(cat[0],cat[1])}<div class="callout">Учите слова небольшими частями. Сначала прочитайте перевод и пример, затем попробуйте составить собственное предложение.</div><div class="toolbar"><span class="tag">${words.length} слов и выражений в этой подборке</span><span class="tag">Перевод + пример</span></div><div style="overflow-x:auto"><table class="wordlist"><thead><tr><th>Эстонский</th><th>Перевод</th><th>Пример</th></tr></thead><tbody>${words.map(w=>`<tr><td class="word">${safe(w[0])}</td><td>${safe(w[1])}</td><td><div class="example">${safe(w[2]||"")}</div>${w[3]?`<div class="small muted">${safe(w[3])}</div>`:""}</td></tr>`).join("")}</tbody></table></div><div class="lesson-actions"><button class="btn" onclick="mark('vocab'+i)">Отметить категорию пройденной</button><button class="btn secondary" onclick="startVocabQuiz(${i})">Проверить слова</button></div>${state.done["vocab"+i]?'<div class="result">✓ Категория отмечена как пройденная. Можно повторить её в любое время.</div>':""}${state.quizResult["vocab"+i]!==undefined?`<div class="small muted">Последний результат теста: ${state.quizResult["vocab"+i]}%</div>`:""}`}
return `${sectionHead("Sõnavara · Словарный запас","16 тематических категорий. Словарь будет расширяться по мере наполнения курса.")}<div class="callout"><b>Как учить:</b> запоминайте не только отдельные слова, но и устойчивые выражения. В B2 важно уметь использовать лексику в контексте.</div><div class="grid">${vocab.map((c,i)=>`<div class="card topic-card"><div class="small muted">КАТЕГОРИЯ ${String(i+1).padStart(2,"0")}</div><h3>${c[0]}</h3><p>${c[1]}</p><p class="small">${c[2].length} слов в текущей подборке</p><div class="lesson-actions"><button class="btn secondary" onclick="state.openLesson=${i};render()">Открыть</button>${state.done["vocab"+i]?'<span class="pill">Пройдено ✓</span>':""}</div></div>`).join("")}</div>`}
function startVocabQuiz(i){let words=vocab[i][2];let qs=words.slice(0,Math.min(10,words.length)).map((w,j)=>({q:`Как переводится «${w[0]}»?`,opts:[w[1],words[(j+2)%words.length][1],words[(j+5)%words.length][1],words[(j+8)%words.length][1]],correct:0,ex:w[0]+" — "+w[1]}));state.quizCustom={title:"Словарь: "+vocab[i][0],qs:qs.map(q=>{let opts=[...new Set(q.opts)];while(opts.length<4)opts.push("—");let correct=opts.indexOf(q.opts[0]);return {...q,opts,correct}}),key:"vocab"+i};state.section="quiz";render();}

const topicLessons=[{"title":"Kaasaegne ühiskond ja selle probleemid","intro":"Неравенство, старение населения, миграция и изменения рынка труда влияют на качество жизни. Анализируй не только проблему, но и её причины, последствия и участников.","et":"Ühiskond muutub pidevalt. Üheks väljakutseks on leida tasakaal majandusarengu ja inimeste heaolu vahel. Probleemide lahendamine eeldab riigi, ettevõtete ja kodanike koostööd.","ru":"Общество постоянно меняется. Одна из задач — найти баланс между экономическим развитием и благополучием людей. Решение проблем требует сотрудничества государства, предприятий и граждан.","task":"Назови общественную проблему, две её причины, последствия и возможное решение.","words":"ühiskondlik probleem — общественная проблема; elanikkond — население; ebavõrdsus — неравенство; heaolu — благополучие"},{"title":"Tehnoloogia mõju igapäevaelule","intro":"Цифровые решения упрощают работу и общение, но требуют внимания к защите данных, безопасности и цифровому неравенству.","et":"Digilahendused muudavad igapäevaelu mugavamaks, kuid nende kasutamisel tuleb arvestada andmekaitse ja turvalisusega. Tehnoloogia peaks inimest toetama, mitte tema otsuseid täielikult asendama.","ru":"Цифровые решения делают жизнь удобнее, но при их использовании нужно учитывать защиту данных и безопасность. Технологии должны помогать человеку, а не полностью заменять его решения.","task":"Приведи два преимущества и два риска цифровых технологий.","words":"digilahendus — цифровое решение; andmekaitse — защита данных; privaatsus — конфиденциальность; automatiseerimine — автоматизация"},{"title":"Tehisintellekt: võimalused ja ohud","intro":"ИИ помогает анализировать информацию и автоматизировать задачи. Важно проверять результаты, учитывать авторское право, приватность и ответственность человека.","et":"Tehisintellekti vastuseid ei saa alati pimesi usaldada. Süsteem võib esitada ebatäpset teavet või korrata andmetes esinevaid eelarvamusi. Seetõttu peab inimene tulemusi hindama.","ru":"Ответам ИИ нельзя всегда доверять без проверки. Система может выдавать неточную информацию или повторять предубеждения из данных. Поэтому человек должен оценивать результаты.","task":"В каких ситуациях ИИ полезен, а в каких решение должен принимать человек? Обоснуй.","words":"tehisintellekt — ИИ; eelarvamus — предубеждение; usaldusväärsus — надёжность; vastutus — ответственность"},{"title":"Hariduse tulevik","intro":"Образование включает не только запоминание фактов, но и критическое мышление, сотрудничество и обучение на протяжении всей жизни.","et":"Tuleviku haridus ei tähenda ainult faktide meeldejätmist. Üha olulisemaks muutuvad kriitiline mõtlemine, koostöö ja oskus uut teavet hinnata.","ru":"Образование будущего — не только запоминание фактов. Всё важнее становятся критическое мышление, сотрудничество и умение оценивать новую информацию.","task":"Какие три навыка будут особенно важны через десять лет? Объясни.","words":"elukestev õpe — обучение всю жизнь; õppekava — программа; kriitiline mõtlemine — критическое мышление; õppemeetod — метод обучения"},{"title":"Elukutsevalik ja tööturg","intro":"При выборе профессии учитывают интересы, способности, условия работы и возможности развития. Рынок меняется под влиянием технологий и экономики.","et":"Tööandjad hindavad lisaks erialastele teadmistele ka suhtlemisoskust ja kohanemisvõimet. Töötaja peab hoolitsema selle eest, et töökoormus ei kahjustaks tema heaolu.","ru":"Работодатели ценят профессиональные знания, навыки общения и адаптивность. Работнику важно следить, чтобы нагрузка не вредила его благополучию.","task":"Сравни зарплату, интерес к работе и условия труда как факторы выбора профессии.","words":"tööturg — рынок труда; tööandja — работодатель; töökoormus — нагрузка; erialane areng — развитие"},{"title":"Keskkonnaprobleemid ja inimese vastutus","intro":"Экологические проблемы связаны с производством, транспортом, потреблением и использованием природных ресурсов. Ответственность разделяют люди, компании и государство.","et":"Keskkonnakaitse ei sõltu ainult üksikisiku harjumustest. Ettevõtted saavad muuta tootmist säästlikumaks ning riik saab luua reegleid, mis vähendavad saastamist.","ru":"Защита природы зависит не только от привычек отдельного человека. Компании могут сделать производство устойчивее, а государство — создать правила, уменьшающие загрязнение.","task":"Распредели ответственность между человеком, бизнесом и государством.","words":"keskkonnakaitse — защита природы; loodusvara — ресурс; saastamine — загрязнение; keskkonnajalajälg — экологический след"},{"title":"Kliimamuutused ja säästev areng","intro":"Устойчивое развитие объединяет экологические, экономические и социальные цели. Оценивай не только пользу решения, но и его стоимость и последствия.","et":"Taastuvenergia kasutamine võib vähendada fossiilkütuste tarbimist. Samas tuleb hinnata ka uute lahenduste hinda, mõju loodusele ja kättesaadavust.","ru":"Возобновляемая энергия может уменьшить использование ископаемого топлива. При этом нужно оценивать стоимость решений, их влияние на природу и доступность.","task":"Предложи три реалистичных шага для более устойчивого города.","words":"taastuvenergia — возобновляемая энергия; heitkogus — выброс; säästev areng — устойчивое развитие; elurikkus — биоразнообразие"},{"title":"Sotsiaalmeedia ja meedia mõju","intro":"Медиа распространяют информацию и влияют на общественное мнение. Важно отличать факт от мнения, проверять источник и замечать манипуляции.","et":"Enne uudise jagamist tasub kontrollida selle autorit, avaldamise aega ja algallikat. Sensatsiooniline pealkiri ei tähenda veel, et sisu oleks usaldusväärne.","ru":"Перед распространением новости стоит проверить автора, дату и первоисточник. Сенсационный заголовок ещё не означает, что содержание надёжно.","task":"Опиши последовательность проверки сомнительной новости.","words":"valeinfo — ложная информация; allikakriitika — критика источников; kajastama — освещать; meediapädevus — медиаграмотность"},{"title":"Inimõigused ja võrdsus","intro":"Права человека защищают достоинство и свободы каждого. Равное обращение предполагает уважение и доступность возможностей.","et":"Demokraatlikus ühiskonnas peavad õigused kehtima kõigile. Diskrimineerimise vähendamiseks on vaja nii selgeid seadusi kui ka inimeste teadlikkust.","ru":"В демократическом обществе права должны действовать для всех. Для уменьшения дискриминации нужны ясные законы и осведомлённость людей.","task":"Почему равные права важны? Приведи аргумент и пример.","words":"inimõigus — право человека; võrdõiguslikkus — равноправие; diskrimineerimine — дискриминация; väärikus — достоинство"},{"title":"Majandus ja rahatarkus","intro":"Финансовая грамотность помогает планировать доходы и расходы, сравнивать предложения и понимать последствия займов.","et":"Inflatsioon vähendab raha ostujõudu. Seetõttu on kasulik koostada eelarve, jälgida kulutusi ja luua võimaluse korral säästupuhver.","ru":"Инфляция снижает покупательную способность денег. Поэтому полезно составлять бюджет, следить за расходами и создавать резерв.","task":"Объясни, зачем нужен личный бюджет.","words":"inflatsioon — инфляция; ostujõud — покупательная способность; eelarve — бюджет; säästmine — накопление"},{"title":"Kultuurilised erinevused ja traditsioonid","intro":"Культурные различия проявляются в языке, обычаях и общении. Знакомство с ними помогает избегать стереотипов и проявлять уважение.","et":"Kultuuriline mitmekesisus võib ühiskonda rikastada. Arusaamatusi aitab vältida avatud suhtlemine ja valmisolek küsida, mitte oletada.","ru":"Культурное разнообразие обогащает общество. Избежать недопонимания помогают открытое общение и готовность спрашивать, а не предполагать.","task":"Как сохранить традиции и быть открытым новым обычаям?","words":"kultuuripärand — наследие; traditsioon — традиция; mitmekesisus — разнообразие; sallivus — терпимость"},{"title":"Psühholoogiline heaolu ja stress","intro":"Благополучие зависит от отдыха, отношений, чувства безопасности и умения справляться с нагрузкой. Важно замечать переутомление и обращаться за поддержкой.","et":"Pikaajaline stress võib mõjutada keskendumist ja enesetunnet. Tasakaalu aitavad hoida puhkus, realistlik ajakava ja usaldusväärsete inimestega rääkimine.","ru":"Длительный стресс может влиять на концентрацию и самочувствие. Помогают отдых, реалистичное расписание и разговор с людьми, которым доверяешь.","task":"Какие способы помогают сохранять баланс между учёбой, работой и отдыхом?","words":"vaimne heaolu — благополучие; stressiga toimetulek — справляться со стрессом; motivatsioon — мотивация; läbipõlemine — выгорание"},{"title":"Globaliseerumine ja rahvusvaheline koostöö","intro":"Глобализация усиливает связи между странами в торговле, культуре и технологиях. Она создаёт возможности, но и взаимозависимость.","et":"Rahvusvaheline koostöö on vajalik probleemide puhul, mis ei piirdu ühe riigi piiridega. Samas võivad riikide huvid ja väärtused erineda.","ru":"Международное сотрудничество необходимо для проблем, которые не ограничиваются границами одной страны. При этом интересы и ценности государств могут различаться.","task":"Назови глобальную проблему и объясни, почему одной стране трудно решить её самостоятельно.","words":"globaliseerumine — глобализация; rahvusvaheline koostöö — сотрудничество; sõltuvus — зависимость; läbirääkimised — переговоры"},{"title":"Tarbimine ja vastutustundlik ressursikasutus","intro":"Осознанное потребление учитывает цену, качество, срок службы, условия производства и влияние товара на окружающую среду.","et":"Enne ostmist võiks küsida, kas toodet on tõesti vaja ja kui kaua seda kasutatakse. Parandamine ja korduskasutus aitavad vähendada jäätmeid.","ru":"Перед покупкой стоит спросить, действительно ли нужен товар и как долго он будет использоваться. Ремонт и повторное использование уменьшают отходы.","task":"Назови конкретные решения, которые помогают потреблять ответственнее.","words":"teadlik tarbimine — осознанное потребление; tarneahel — цепочка поставок; korduskasutus — повторное использование; jäätmed — отходы"},{"title":"Inimestevahelised konfliktid ja nende lahendamine","intro":"Конфликты возникают из-за разных ожиданий и интересов. Конструктивное решение требует выслушать стороны, уточнить проблему и искать компромисс.","et":"Konflikti lahendamisel on oluline rääkida probleemist, mitte rünnata inimest. Aktiivne kuulamine aitab mõista teise poole vajadusi.","ru":"При решении конфликта важно говорить о проблеме, а не нападать на человека. Активное слушание помогает понять потребности другой стороны.","task":"Опиши три шага, которые помогут двум сторонам договориться.","words":"kompromiss — компромисс; vastastikune mõistmine — взаимопонимание; usaldus — доверие; koostöö — сотрудничество"},{"title":"Ühiskonna tulevik ja isiklik vastutus","intro":"Будущее зависит от решений в образовании, технологиях, экологии и социальной политике. Личная ответственность проявляется в участии и уважении к другим.","et":"Üks inimene ei saa kõiki ühiskonna probleeme lahendada, kuid tema valikud mõjutavad kogukonda. Väikesed järjepidevad teod võivad koos anda märgatava tulemuse.","ru":"Один человек не может решить все проблемы общества, но его выбор влияет на сообщество. Небольшие последовательные действия вместе дают заметный результат.","task":"Что человек может сделать для улучшения своего сообщества?","words":"isiklik vastutus — личная ответственность; kogukond — сообщество; osalemine — участие; tulevik — будущее"}];
const grammarLessons=[{"title":"Liitlaused","rule":"Части сложного предложения соединяются союзами; союз показывает логическую связь.","example":"Ma jäin koju, sest olin haige. — Я остался дома, потому что болел.","tip":"Sest вводит причину, kuid/aga — противопоставление.","q":"Какой союз выражает причину?","opts":["sest","aga","kuid","või"],"correct":0,"ex":"Sest = потому что."},{"title":"Põimlaused","rule":"В сложноподчинённом предложении есть главная и зависимая части.","example":"Ma arvan, et see otsus on vajalik. — Я думаю, что это решение необходимо.","tip":"Придаточная часть зависит от главной.","q":"Где есть придаточная часть?","opts":["Ma tean, et ta tuleb.","Ta tuli koju.","Ilm on külm.","Lapsed mängivad."],"correct":0,"ex":"Et ta tuleb — придаточная часть."},{"title":"Kõrvallaused","rule":"Придаточные поясняют время, причину, условие или предмет.","example":"Kui mul on aega, lähen jalutama. — Если будет время, пойду гулять.","tip":"Kui может означать «когда» или «если» — смотри на контекст.","q":"Какой союз вводит условие?","opts":["kui","sest","et","kuigi"],"correct":0,"ex":"Kui вводит условие."},{"title":"Aja-, põhjus- ja tingimuslaused","rule":"Временные отвечают «когда?», причинные — «почему?», условные — «при каком условии?».","example":"Kui töö lõpeb, helistan sulle. — Когда работа закончится, я позвоню.","tip":"Не смешивай временное и условное значение kui.","q":"«Мы остались дома, потому что шёл дождь» — это придаточное…","opts":["времени","причины","условия","цели"],"correct":1,"ex":"Оно объясняет причину."},{"title":"Relatiivlaused","rule":"Относительное придаточное уточняет существительное; kes обычно относится к человеку, mis — к предмету.","example":"Inimene, kes siin töötab, on õpetaja. — Человек, который здесь работает, учитель.","tip":"Выбирай местоимение по тому, к чему оно относится.","q":"Для предмета обычно используют…","opts":["mis","kes","kelle","keda"],"correct":0,"ex":"Mis относится к предмету или явлению."},{"title":"Sidesõnad ja loogilised seosed","rule":"Союзы показывают добавление, противопоставление, причину, уступку и условие.","example":"Ta oli väsinud, kuid jätkas tööd. — Он устал, однако продолжил работу.","tip":"Выбирай союз по логике, а не по привычке.","q":"Какой союз значит «однако»?","opts":["kuid","sest","kui","et"],"correct":0,"ex":"Kuid = однако."},{"title":"Ajavormide kasutamine","rule":"Времена выбирают по отношению к моменту речи и другим событиям.","example":"Eile kirjutasin kirja. — Вчера я написал письмо.","tip":"Сохраняй понятную временную линию в тексте.","q":"«Вчера я написал» — выбери форму.","opts":["kirjutan","kirjutasin","kirjutaksin","kirjuta"],"correct":1,"ex":"Kirjutasin — прошедшее время."},{"title":"Enneminevik","rule":"Enneminevik показывает действие, завершившееся до другого момента в прошлом.","example":"Kui jõudsin, oli koosolek juba alanud. — Когда я пришёл, собрание уже началось.","tip":"Нужно два прошлых момента: одно действие произошло раньше другого.","q":"Выбери верную форму: «фильм уже закончился, когда я пришёл».","opts":["Kui tulin, oli film juba lõppenud.","Kui tulen, film lõppes.","Kui tulin, film lõpetab.","Kui tulen, oli film lõppenud."],"correct":0,"ex":"Oli lõppenud — действие произошло раньше прихода."},{"title":"Tingiv kõneviis","rule":"Условное наклонение выражает возможность, желание или вежливую просьбу; часто имеет показатель -ks.","example":"Ma sooviksin rohkem teada. — Я хотел(а) бы узнать больше.","tip":"Sooviksin — не обычное настоящее, а вежливое желание.","q":"Какая форма значит «я хотел(а) бы»?","opts":["soovin","sooviksin","soovisin","soovinud"],"correct":1,"ex":"Sooviksin — условная форма."},{"title":"Tingimuslaused","rule":"Условные предложения связывают условие и результат.","example":"Kui mul oleks aega, õpiksin rohkem. — Если бы у меня было время, я бы больше учился.","tip":"В гипотетической конструкции согласуй обе части.","q":"Закончи: Kui mul oleks aega, ma…","opts":["õpiksin rohkem","õpin eile","õppisin homme","õppima"],"correct":0,"ex":"Õpiksin соответствует гипотетическому условию."},{"title":"Kaudne kõneviis","rule":"Косвенное наклонение передаёт чужое сообщение или неподтверждённую информацию.","example":"Ta olevat juba lahkunud. — Говорят, он уже ушёл.","tip":"Это не просто прошедшее время: источник информации не сам говорящий.","q":"Olevat передаёт…","opts":["чужое сообщение","приказ","будущее","вежливую просьбу"],"correct":0,"ex":"Olevat передаёт сообщение со слов других."},{"title":"Käskiv kõneviis","rule":"Повелительное наклонение используют для просьб, инструкций и советов.","example":"Palun avage aken. — Пожалуйста, откройте окно.","tip":"Palun смягчает просьбу.","q":"Что звучит вежливее?","opts":["Ava kohe!","Palun avage aken.","Sa avad akna.","Aken avati."],"correct":1,"ex":"Palun avage — вежливая просьба."},{"title":"Kesksõnad","rule":"Причастия образуются от глагола и описывают действие или предмет.","example":"Lõpetatud töö saadeti juhile. — Завершённую работу отправили руководителю.","tip":"Kirjutav — пишущий; kirjutatud — написанный.","q":"Kirjutatud означает…","opts":["пишущий","написанный","писать","будет писать"],"correct":1,"ex":"Kirjutatud — написанный."},{"title":"Kesksõnalised konstruktsioonid","rule":"Причастная конструкция может заменить придаточное и сделать текст компактнее.","example":"Konkursil osalenud õpilased said tunnistuse. — Ученики, участвовавшие в конкурсе, получили сертификат.","tip":"Проверь, к какому существительному относится причастие.","q":"Osalenud õpilased — это ученики, которые…","opts":["участвовали","участвуют завтра","преподают","будут приглашены"],"correct":0,"ex":"Osalenud — участвовавшие."},{"title":"Infinitiivitarindid","rule":"Выбор ma- или da-инфинитива зависит от конструкции и управляющего глагола.","example":"Soovin õppida. Lähen õppima. — Хочу учиться. Иду учиться.","tip":"Запоминай модели с конкретными глаголами.","q":"После soovin обычно стоит…","opts":["da-инфинитив","ma-инфинитив","только причастие","прошедшее время"],"correct":0,"ex":"Soovin õppida — da-инфинитив."},{"title":"Tegusõnade rektsioon","rule":"Некоторые глаголы требуют определённого падежа зависимого слова.","example":"Ma osalen projektis. — Я участвую в проекте.","tip":"Не переноси управление из русского дословно.","q":"Правильно: osalema…","opts":["projektis","projekti","projektiga","projektist"],"correct":0,"ex":"Osalema + inessiiv: projektis."},{"title":"Umbisikuline tegumood","rule":"Безличная форма фокусируется на действии, а не на исполнителе.","example":"Siin räägitakse eesti keelt. — Здесь говорят по-эстонски.","tip":"Используется в правилах, инструкциях и официальной речи.","q":"Где безличная форма?","opts":["Siin kirjutatakse palju.","Mina kirjutan.","Õpilane kirjutab.","Nad kirjutasid."],"correct":0,"ex":"Kirjutatakse — безличная форма."},{"title":"Kaudse kõne vahendamine","rule":"При передаче чужих слов меняются местоимения и иногда временные формы.","example":"Ta ütles, et ta on valmis. — Она сказала, что готова.","tip":"Следи за тем, кто произносил исходную фразу.","q":"Правильно передать «Она сказала: я готова».","opts":["Ta ütles, et ta on valmis.","Ta ütles, et mina valmis.","Ta ütles valmis olema.","Ta ütles, et valmis eile."],"correct":0,"ex":"Ta ütles, et ta on valmis."},{"title":"Tuletamine","rule":"Суффиксы образуют слова, обозначающие человека, действие, качество или результат.","example":"õppima → õppimine; õpetama → õpetaja.","tip":"Производное слово может иметь новое значение.","q":"Õpetaja означает…","opts":["учитель","ученик","урок","обучение"],"correct":0,"ex":"Õpetaja — учитель."},{"title":"Liitsõnad","rule":"Сложные слова обычно пишутся слитно; первая часть уточняет вторую.","example":"keskkonnaprobleem — экологическая проблема.","tip":"Не разделяй обычное сложное слово пробелом.","q":"Как правильно написать «рынок труда»?","opts":["tööturg","töö turg","töö-turg","tööt urg"],"correct":0,"ex":"Tööturg пишется слитно."},{"title":"Tegevusnimed","rule":"Существительные на -mine часто называют процесс или действие.","example":"Otsustamine võtab aega. — Принятие решения занимает время.","tip":"Не путай существительное с личной формой глагола.","q":"Õppimine — это…","opts":["обучение","я учусь","учитель","учился"],"correct":0,"ex":"Õppimine — процесс обучения."},{"title":"Võrdlusastmed","rule":"Сравнительная степень часто имеет -m; превосходная может строиться с kõige.","example":"See on kõige tõhusam lahendus. — Это самое эффективное решение.","tip":"Kõige + сравнительная форма выражает превосходную степень.","q":"Как сказать «самый важный»?","opts":["kõige tähtsam","tähtis","tähtsam","tähtsalt"],"correct":0,"ex":"Kõige tähtsam — самый важный."},{"title":"Arvsõnade ja asesõnade käänamine","rule":"Числительные и местоимения изменяются по падежам в зависимости от роли в предложении.","example":"Rääkisin kahe sõbraga. — Я говорил с двумя друзьями.","tip":"Проверяй падеж всего словосочетания.","q":"Правильно «с двумя друзьями»…","opts":["kahe sõbraga","kaks sõpra","kaks sõbraga","kahte sõber"],"correct":0,"ex":"Kahe sõbraga — правильная форма."},{"title":"Sõnajärg ja rõhutamine","rule":"Порядок слов помогает выделять тему и новую информацию; его можно менять ради акцента.","example":"Just seda võimalust me vajame. — Именно эта возможность нам нужна.","tip":"Не копируй русский порядок слов механически.","q":"Какое слово выделяет «именно»?","opts":["just","sest","kuigi","veel"],"correct":0,"ex":"Just усиливает элемент."},{"title":"Rektsioon: omadussõnad","rule":"Прилагательные и выражения тоже могут требовать определённого падежа.","example":"Olen huvitatud sellest teemast. — Я заинтересован этой темой.","tip":"Запоминай вопрос: huvitatud millest?","q":"Huvitatud требует…","opts":["millest?","kellele?","kuhu?","kellega?"],"correct":0,"ex":"Huvitatud millest — elatiiv."},{"title":"Astmevaheldus","rule":"Чередование ступеней меняет основу или согласные в разных формах слова.","example":"linn — linna; tuba — toa.","tip":"Не все слова изменяются одинаково; п function topicsView(){return `${sectionHead("Teemad · Темы","16 тематических уроков: объяснение, эстонский текст, перевод, лексика и задание.")}<div class="grid">${topics.map((t,i)=>`<div class="card topic-card"><span class="small muted">УРОК ${i+1} / 16</span><h3>${t}</h3><p>${topicLessons[i].intro}</p><button class="btn secondary" onclick="openGeneric('topic',${i})">Открыть урок</button>${state.done['topic'+i]?'<span class="pill">Пройдено ✓</span>':''}</div>`).join('')}</div>`}
function grammarView(){let n=0;return `${sectionHead("Grammatika · Грамматика","30 уроков B2. Каждый включает правило, пример, подсказку и проверочное задание.")}${grammarBlocks.map((b,i)=>`<div class="lesson"><h3>${i+1}. ${b[0]}</h3><div class="grid">${b[1].map(x=>{let id=n++;return `<div class="card"><span class="small muted">УРОК ${id+1} / 30</span><b>${x}</b><p class="small muted">Правило · пример · проверка</p><button class="btn secondary" onclick="openGrammar(${id})">Изучить</button>${state.done['grammar'+id]?'<span class="pill">Пройдено ✓</span>':''}</div>`}).join('')}</div></div>`).join('')}`}
function practiceView(){let items=["Точность словаря и синонимы","Грамматические формы и исправление ошибок","Перефразирование предложений","Анализ текста и поиск аргументов","Язык в жизненных ситуациях","Смешанная практика B2"];return `${sectionHead("Harjutamine · Практика","6 тренировок по 8 вопросов. После проверки видны ответы, объяснения и результат.")}<div class="grid">${items.map((x,i)=>`<div class="card topic-card"><span class="small muted">ТРЕНИРОВКА ${i+1} / 6</span><h3>${x}</h3><p>8 заданий с проверкой и объяснениями.</p><button class="btn secondary" onclick="openPractice(${i})">Начать</button></div>`).join('')}</div>`}
function readingView(){return `${sectionHead("Lugemine · Чтение","12 текстов на эстонском языке. Каждый сопровождается 8 вопросами на понимание и анализ.")}<div class="grid">${readingLessons.map((x,i)=>`<div class="card topic-card"><span class="small muted">ТЕКСТ ${i+1} / 12</span><h3>${x.title}</h3><p>${x.text.slice(0,130)}…</p><button class="btn secondary" onclick="openGeneric('reading',${i})">Читать и выполнить задания</button>${state.quizResult['reading'+i]!==undefined?`<span class="pill">Результат: ${state.quizResult['reading'+i]}%</span>`:''}</div>`).join('')}</div>`}
function writingView(){return `${sectionHead("Kirjutamine · Письмо","10 уроков: структура текста, аргументы, письма, статья, отчёт и эссе B2.")}<div class="callout">Черновики можно сохранять в рамках сессии браузера. Автоматическая ИИ-оценка свободного текста требует отдельного сервера и подключения модели.</div><div class="grid">${writingTitles.map((x,i)=>`<div class="card topic-card"><span class="small muted">УРОК ${i+1} / 10</span><h3>${x}</h3><p>${writingPlans[i].goal}</p><button class="btn secondary" onclick="openWriting(${i})">Изучить</button></div>`).join('')}</div>`}
function opinionView(){return `${sectionHead("Arvamuse avaldamine · Выражение мнения","12 уроков для дискуссий: позиция, аргументы, контраргументы, сравнение и выводы.")}<div class="grid">${opinionTitles.map((x,i)=>`<div class="card topic-card"><span class="small muted">УРОК ${i+1} / 12</span><h3>${x}</h3><p>${opinionLessons[i].goal}</p><button class="btn secondary" onclick="openGeneric('opinion',${i})">Открыть урок</button></div>`).join('')}</div>`}
function testsView(){return `${sectionHead("Testid · Тесты","36 тестов. В каждом 8 вопросов по грамматике, словарю, темам и языковым навыкам.")}<div class="grid">${tests.map((x,i)=>`<div class="card topic-card"><span class="small muted">ТЕСТ ${i+1} / 36</span><h3>${x}</h3><p>8 вопросов · ответы · объяснения · результат</p><button class="btn secondary" onclick="startFullTest(${i})">Начать тест</button>${state.quizResult['test'+i]!==undefined?`<span class="pill">Результат: ${state.quizResult['test'+i]}%</span>`:''}</div>`).join('')}</div>`}
function progressView(){let total=Object.keys(state.done).filter(k=>state.done[k]).length;let max=vocab.length+topicLessons.length+grammarLessons.length+writingPlans.length;let pct=Math.round(total/max*100);let vals=Object.values(state.quizResult);let avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;return `${sectionHead("Minu areng · Мой прогресс","Завершённые уроки и результаты проверочных работ.")}<div class="card"><div class="section-head"><div><h3>Общий прогресс</h3><p class="sub">Словарь, темы, грамматика и письмо</p></div><b class="gold">${pct}%</b></div><div class="progressbar"><i style="width:${pct}%"></i></div><p class="small muted">${total} завершённых элементов из ${max} основных уроков.</p></div><div class="grid" style="margin-top:14px"><div class="card"><h3>Словарь</h3><p>${vocab.filter((v,i)=>state.done['vocab'+i]).length} / ${vocab.length}</p></div><div class="card"><h3>Темы</h3><p>${topicLessons.filter((v,i)=>state.done['topic'+i]).length} / 16</p></div><div class="card"><h3>Грамматика</h3><p>${grammarLessons.filter((v,i)=>state.done['grammar'+i]).length} / 30</p></div><div class="card"><h3>Письмо</h3><p>${writingPlans.filter((v,i)=>state.done['writing'+i]).length} / 10</p></div><div class="card"><h3>Тесты</h3><p>${vals.length} результатов · средний балл ${avg}%</p></div></div><div class="callout">Прогресс сохраняется в этом браузере. Для синхронизации между устройствами понадобится аккаунт и база данных.</div>`}
function genericDetail(type,i){if(type==='topic'){let d=topicLessons[i];return `<button class="back" onclick="render()">← Назад к темам</button>${sectionHead(d.title,'Тематический урок B2')}<div class="lesson"><h3>1. Объяснение</h3><p>${d.intro}</p><h3>2. Текст на эстонском</h3><p class="example">${d.et}</p><h3>3. Перевод</h3><p>${d.ru}</p><h3>4. Полезная лексика</h3><p>${d.words}</p><h3>5. Задание</h3><p>${d.task}</p><textarea id="topicAnswer" class="field textarea" placeholder="Kirjuta oma vastus eesti keeles..."></textarea><div class="lesson-actions"><button class="btn secondary" onclick="state.topicDraft${i}=document.getElementById('topicAnswer').value;alert('Ответ сохранён в этой сессии.')">Сохранить ответ</button><button class="btn" onclick="mark('topic${i}')">Отметить урок пройденным</button></div></div>`}
if(type==='reading'){let d=readingLessons[i];return `<button class="back" onclick="render()">← Назад к чтению</button>${sectionHead(d.title,'Текст B2 · понимание и анализ')}<div class="lesson"><h3>Текст на эстонском</h3><p class="example" style="line-height:2">${d.text}</p><p class="small muted">Сначала прочитай текст самостоятельно, затем ответь на вопросы. Вопросы проверяют общую мысль, выводы и детали.</p></div>${quizHTML('reading'+i,d.qs.map(q=>[q.q,...q.opts,q.correct,q.ex]))}`}
if(type==='opinion'){let d=opinionLessons[i];return `<button class="back" onclick="render()">← Назад</button>${sectionHead(opinionTitles[i],'Аргументированная речь B2')}<div class="lesson"><h3>Цель урока</h3><p>${d.goal}</p><h3>Полезные выражения</h3><p>${d.phrases}</p><h3>Пример</h3><p class="example">${d.model}</p><h3>Твоё задание</h3><p>${d.task}</p><textarea id="opinionAnswer" class="field textarea" placeholder="Kirjuta oma vastus eesti keeles..."></textarea><div class="lesson-actions"><button class="btn secondary" onclick="state.opinionDraft${i}=document.getElementById('opinionAnswer').value;alert('Ответ сохранён в этой сессии.')">Сохранить ответ</button><button class="btn" onclick="mark('opinion${i}')">Отметить урок</button></div></div>`}
return `<button class="back" onclick="render()">← Назад</button>`}
function openGeneric(t,i){state.detail={type:t,i};state.section='detail';render();}
function openGrammar(i){state.detail={type:'grammar',i};state.section='detail';render();}
function grammarDetail(i){let d=grammarLessons[i];return `<button class="back" onclick="render()">← Назад к грамматике</button>${sectionHead(d.title,'Грамматика B2 · правило, пример и проверка')}<div class="lesson"><h3>1. Правило</h3><p>${d.rule}</p><h3>2. Пример</h3><p class="example">${d.example}</p><h3>3. Важно</h3><p>${d.tip}</p><h3>4. Проверь себя</h3>${quizHTML('grammar'+i,[[d.q,...d.opts,d.correct,d.ex]])}<button class="btn" onclick="mark('grammar${i}')">Отметить урок пройденным</button></div>`}
function openWriting(i){state.detail={type:'writing',i};state.section='detail';render();}
function writingDetail(i){let d=writingPlans[i];return `<button class="back" onclick="render()">← Назад к письму</button>${sectionHead(writingTitles[i],'Письменная речь B2')}<div class="lesson"><h3>Цель</h3><p>${d.goal}</p><h3>Структура и правило</h3><p>${d.rule}</p><h3>Полезные выражения</h3><p>${d.phrases}</p><h3>Задание</h3><p>${d.task}</p><div class="card"><h3>Мой черновик</h3><textarea id="draft" class="field textarea" placeholder="Kirjuta oma tekst siia...">${safe(state.writingText)}</textarea><button class="btn secondary" onclick="state.writingText=document.getElementById('draft').value;alert('Черновик сохранён в этой сессии.')">Сохранить черновик</button><p class="small muted">Автоматической ИИ-проверки пока нет.</p></div><button class="btn" style="margin-top:14px" onclick="mark('writing${i}')">Отметить урок</button></div>`}
function openPractice(i){state.detail={type:'practice',i};state.section='detail';render();}
function practiceDetail(i){let qs=fullTests[24+i];return `<button class="back" onclick="render()">← Назад к практике</button>${sectionHead('Практика '+(i+1),'8 заданий · проверка и объяснения')}${quizHTML('practice'+i,qs.map(q=>[q.q,...q.opts,q.correct,q.ex]))}`}
function startFullTest(i){state.quizCustom={title:tests[i],key:'test'+i,qs:fullTests[i]};state.section='quiz';render();}
function quizHTML(key,arr){return `<form id="quizForm">${arr.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>${q.slice(1,5).map((x,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${x}</label>`).join("")}<div class="feedback hidden" id="fb${i}"></div></div>`).join("")}<button type="button" class="btn" onclick="checkQuiz('${key}',${JSON.stringify(arr).replace(/</g,'\\u003c')})">Проверить ответы</button></form><div id="quizResult" class="hidden"></div>`}
function checkQuiz(key,arr){let correct=0;arr.forEach((q,i)=>{let sel=document.querySelector(`input[name=q${i}]:checked`);let val=sel?Number(sel.value):-1;let ok=val===q[5];if(ok)correct++;document.querySelectorAll(`input[name=q${i}]`).forEach((el,j)=>{el.disabled=true;el.parentElement.classList.toggle("correct",j===q[5]);el.parentElement.classList.toggle("wrong",j===val&&!ok)});let fb=document.getElementById("fb"+i);fb.classList.remove("hidden");fb.textContent=(ok?"Правильно. ":"Ошибка. Правильный ответ: "+q[q[5]+1]+". ")+q[6];});let pct=Math.round(correct/arr.length*100);state.quizResult[key]=pct;save();let r=document.getElementById("quizResult");r.classList.remove("hidden");r.className="result";r.innerHTML=`<b>Результат: ${correct} из ${arr.length} (${pct}%)</b><p>${arr.length-correct} ошибок. Все правильные ответы и объяснения показаны выше.</p><button class="btn secondary" onclick="render()">Вернуться</button>`;}
function startDemoTest(i){state.quizCustom={title:tests[i],key:"test"+i,qs:[{q:"Что означает «ühiskondlik vastutus»?",opts:["общественная ответственность","личная свобода","экономический рост","уровень жизни"],correct:0,ex:"Ühiskondlik vastutus — общественная ответственность."},{q:"Выберите выражение «обращать внимание».",opts:["tähelepanu juhtima","mõju avaldama","seisukohta väljendama","osa võtma"],correct:0,ex:"Tähelepanu juhtima — обращать внимание."},{q:"Как переводится «säästev areng»?",opts:["устойчивое развитие","быстрый рост","социальная поддержка","свободный рынок"],correct:0,ex:"Säästev areng — устойчивое развитие."},{q:"Что означает «ebavõrdsus»?",opts:["равенство","неравенство","солидарность","разнообразие"],correct:1,ex:"Ebavõrdsus — неравенство."},{q:"Как сказать «оказывать влияние»?",opts:["mõju avaldama","probleemi lahendama","tähelepanu juhtima","ühiskonnas osalema"],correct:0,ex:"Mõju avaldama — оказывать влияние."}]};state.section="quiz";render();}
function quizView(){let q=state.quizCustom;if(!q)return testsView();return `<button class="back" onclick="setSection('tests')">← Назад к тестам</button>${sectionHead(q.title,"Демонстрационный тест · выберите один ответ")}<form id="customQuiz">${q.qs.map((x,i)=>`<div class="question"><b>${i+1}. ${x.q}</b>${x.opts.map((o,j)=>`<label class="option"><input type="radio" name="cq${i}" value="${j}">${o}</label>`).join("")}<div class="feedback hidden" id="cfeed${i}"></div></div>`).join("")}<button type="button" class="btn" onclick="checkCustom()">Проверить тест</button></form><div id="customResult" class="hidden"></div>`}
function checkCustom(){let q=state.quizCustom,correct=0;q.qs.forEach((x,i)=>{let el=document.querySelector(`input[name=cq${i}]:checked`),v=el?Number(el.value):-1,ok=v===x.correct;if(ok)correct++;document.querySelectorAll(`input[name=cq${i}]`).forEach((e,j)=>{e.disabled=true;e.parentElement.classList.toggle("correct",j===x.correct);e.parentElement.classList.toggle("wrong",j===v&&!ok)});let f=document.getElementById("cfeed"+i);f.classList.remove("hidden");f.textContent=(ok?"Правильно. ":"Ошибка. Верный ответ: "+x.opts[x.correct]+". ")+x.ex;});let p=Math.round(correct/q.qs.length*100);state.quizResult[q.key]=p;save();let r=document.getElementById("customResult");r.className="result";r.classList.remove("hidden");r.innerHTML=`<b>Результат: ${correct}/${q.qs.length} · ${p}%</b><p>${q.qs.length-correct} ошибок. Ответы и объяснения показаны в заданиях.</p><button class="btn secondary" onclick="setSection('tests')">К списку тестов</button>`;}
function render(){let body;if(state.section==="detail"){let d=state.detail;body=d.type==="grammar"?grammarDetail(d.i):d.type==="writing"?writingDetail(d.i):d.type==="practice"?practiceDetail(d.i):genericDetail(d.type,d.i);}else if(state.section==="quiz"){body=quizView();}else{let views={vocab:vocabView,topics:topicsView,grammar:grammarView,practice:practiceView,reading:readingView,writing:writingView,opinion:opinionView,tests:testsView,progress:progressView};body=views[state.section]();}main.innerHTML=`<div class="breadcrumb">Главная / Уровни / B2</div><div class="hero"><small>ESTONIAN LANGUAGE COURSE</small><h1>Уверенно используй эстонский 🇪🇪</h1><p>Добро пожаловать на B2 — самостоятельный уровень. Учись обсуждать сложные темы, аргументировать свою позицию, анализировать тексты и выражать мысли ясно и точно.</p><div class="hero-tag">B2 · Upper Intermediate · Полноценный курс</div></div>${body}`;}
load();render();

</script>
</body>
</html>
